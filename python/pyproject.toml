[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dbx-aws-secrets"
dynamic = ["version"]
description = "Read AWS Secrets Manager secrets from Databricks clusters using the cluster's IAM role (no keys, no passwords)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Data Platform Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
# boto3 is preinstalled on every Databricks Runtime; the lower bound matches DBR 13.3 LTS
# so pip never needs internet access to satisfy it.
dependencies = ["boto3>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "moto[secretsmanager,sts]>=5",
    "build>=1",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "src/dbx_aws_secrets/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_aws_secrets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
